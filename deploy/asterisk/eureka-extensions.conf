; Eureka MVP: additive local AudioSocket route.
; Installed by the controlled-host procedure in docs/phase-1-baseline-and-blocker.md.
; Do not place provider credentials or caller data in this file.

[eureka-operator]
exten => 0,1,Answer()
 same => n,Set(EUREKA_UUID=${SPRINTF(%04x%04x-%04x-4%03x-%04x-%04x%04x%04x,${RAND(0,65535)},${RAND(0,65535)},${RAND(0,65535)},${RAND(0,4095)},${RAND(32768,49151)},${RAND(0,65535)},${RAND(0,65535)},${RAND(0,65535)})})
 same => n,UserEvent(EurekaAudioSocket,EurekaUUID: ${EUREKA_UUID},EurekaUniqueid: ${UNIQUEID})
 same => n,AudioSocket(${EUREKA_UUID},127.0.0.1:9092)
 same => n,Hangup()
